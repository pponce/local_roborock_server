# Reference only: keep an existing working MQTT stream.
# Include INSIDE an existing top-level stream {} context, outside http {}.
# Requires Nginx's stream module. This is MQTT, not a camera stream.
server {
    listen 8881 ssl;
    proxy_pass 127.0.0.1:18881;

    ssl_certificate /etc/nginx/ssl/roborock/api-r.example.com-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/roborock/api-r.example.com-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 10.0.20.0/24;
    allow 10.0.30.0/24;
    deny all;

    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
