# Reference only: keep an existing working API site.
# Include inside Nginx's http context. Replace all example values.
server {
    listen 443 ssl;
    server_name api-r.example.com;

    ssl_certificate /etc/nginx/ssl/roborock/api-r.example.com-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/roborock/api-r.example.com-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 10.0.20.0/24;
    allow 10.0.30.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
