# Include this server block inside Nginx's http context.
# Replace example hostname, certificate paths, and allowed LAN/VLAN subnets.
# Host Nginx -> loopback-published Docker HTTP backend; external_tls mode.
server {
    listen 443 ssl;
    server_name r.example.com;

    ssl_certificate /etc/nginx/ssl/roborock/r.example.com-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/roborock/r.example.com-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 10.0.20.0/24;
    allow 10.0.30.0/24;
    deny all;

    location / {
        # No URI suffix: preserve /iot.roborock.com/fwapi/createca.
        proxy_pass http://127.0.0.1:555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This example is the first proxy; overwrite untrusted client headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
