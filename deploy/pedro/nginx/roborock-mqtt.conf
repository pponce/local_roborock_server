# STREAM-context file. Include inside the top-level stream {} block,
# never from the http {} block or an HTTP site's location {}.
server {
    # Client-facing MQTT TLS port, restricted to the server's LAN IPv4 address.
    listen 192.168.84.2:8881 ssl;

    ssl_certificate /etc/nginx/ssl/onefallday/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/onefallday/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # Server's MQTT proxy in external_tls mode, not its Mosquitto broker.
    proxy_pass 127.0.0.1:18881;
    proxy_ssl off;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
}
