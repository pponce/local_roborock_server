# HTTP-context site file. Nginx terminates TLS; Docker uses external_tls.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-roborock.onefallday.com;

    ssl_certificate /etc/nginx/ssl/onefallday/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/onefallday/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Local networks only.
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow fc00::/7;
    deny all;

    location / {
        # This backend will be published only on the host's loopback interface.
        proxy_pass http://127.0.0.1:555;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Origin passes through unchanged; no garage-specific rewriting.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-roborock.onefallday.com;
    return 301 https://api-roborock.onefallday.com$request_uri;
}
