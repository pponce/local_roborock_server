name: Schedule support checks

on:
  push:
    branches: [CHECK_SERVER_SCHEDULE_INTEGRATION]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: schedule-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Run Python suite
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log
      - name: Publish diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('pytest.log') ? fs.readFileSync('pytest.log','utf8') : 'pytest did not start';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Python ${{ matrix.python }} diagnostics', status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: {title: 'Python test results', summary: text.slice(-50000)}
            });

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: local/roborock-server:schedule-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify schedule module in the built image
        run: >-
          docker run --rm --network none local/roborock-server:schedule-ci
          python -c 'import roborock_local_server.bundled_backend.shared.schedule_runner'
